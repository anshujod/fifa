# ============================================================
# Weekly Data Update — FIFA WC2026 Predictor
# ============================================================
# Runs every Monday at 06:00 UTC.
# Fetches latest international match results from external APIs
# and appends new rows to the dataset without overwriting history.
#
# Required Secrets:
#   FOOTBALL_DATA_API_KEY  — free key from football-data.org
#   RAPIDAPI_KEY           — key from rapidapi.com (optional)
# ============================================================

name: Weekly Data Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD). Default: 30 days ago."
        required: false
        type: string
      to_date:
        description: "End date (YYYY-MM-DD). Default: today."
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python setup ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # ── Run update pipeline ───────────────────────────────
      - name: Fetch latest match results
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            ARGS="$ARGS --from-date ${{ github.event.inputs.from_date }}"
          fi
          if [ -n "${{ github.event.inputs.to_date }}" ]; then
            ARGS="$ARGS --to-date ${{ github.event.inputs.to_date }}"
          fi
          python -m src.data.update $ARGS

      # ── Re-run cleaning pipeline ──────────────────────────
      - name: Re-run data cleaning pipeline
        run: |
          python -m src.data.clean

      # ── Commit and push ──────────────────────────────────
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/raw/international_results.csv
          git add data/processed/clean_results.csv
          git add data/processed/competitive_results.csv
          git add data/processed/friendly_results.csv
          git add data/processed/match_results.csv

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "✅ No new data — nothing to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            NEW_COUNT=$(git diff --cached --numstat data/raw/international_results.csv | awk '{print $1}')
            git commit -m "data: auto-update international results [${TIMESTAMP}] (+${NEW_COUNT} rows)"
            git push
            echo "✅ Pushed ${NEW_COUNT} new match results."
          fi
